# joystick2crsf configuration
#
# All values are defaults. Uncomment and edit to override.

# rate = 125
#   Update rate in Hz. Valid values: 25, 50, 125, 250, 333, 500.
rate=125

# stats = 0
#   Set to 1 to print loop timing statistics to stdout every second.
stats=0

# channels = 0
#   Set to 1 to print channel output values to stdout every frame.
channels=0

# protocol = crsf
#   Output protocol. Valid values: crsf, mavlink.
protocol=crsf

# udp_enabled = 1
#   Enable UDP output stream.
udp_enabled=1

# udp_target = 192.168.0.1:14550
#   Target address for UDP stream. Can be IP:port or [IPv6]:port.
udp_target=192.168.0.1:14550

# sse_enabled = 0
#   Enable Server-Sent Events (HTTP) output stream.
sse_enabled=0

# sse_bind = 127.0.0.1:8070
#   Address and port to bind for SSE server.
sse_bind=127.0.0.1:8070

# sse_path = /sse
#   HTTP path for SSE stream.
sse_path=/sse

# arm_toggle = 5
#   Channel index (1-based) to use as arming switch. The channel will latch
#   high/low based on momentary input from the joystick. Set to 0 to disable.
arm_toggle=5

# joystick_index = 0
#   SDL joystick index to use.
joystick_index=0

# rescan_interval = 5
#   Seconds to wait between attempts to find a joystick if disconnected.
rescan_interval=5

# startup_delay = 5
#   Seconds to wait at startup before first joystick scan (useful for systemd).
startup_delay=5

# use_gamecontroller = 1
#   Use SDL GameController API if available (provides standard mappings).
use_gamecontroller=1

# key_long_threshold_ms = 700
#   Time in milliseconds to consider a button press "long".
key_long_threshold_ms=700

# mavlink_sysid = 255
#   MAVLink system ID for this component.
mavlink_sysid=255

# mavlink_compid = 190
#   MAVLink component ID for this component.
mavlink_compid=190

# mavlink_target_sysid = 1
#   Target MAVLink system ID (e.g. flight controller).
mavlink_target_sysid=1

# mavlink_target_compid = 1
#   Target MAVLink component ID.
mavlink_target_compid=1

# scheduler_prio = 50
#   Real-time scheduling priority (SCHED_FIFO). Set to 0 to disable RT scheduling.
scheduler_prio=50

# action_debounce_ms = 500
#   Minimum time in milliseconds between action key triggers.
action_debounce_ms=500

# Action Bindings
# ---------------
# format: action_<name> = channel=<1-16>, edge=<high|low>, press=<short|long|any>, transport=<udp|http>, ...
#
# Examples:
# action_takeoff = channel=6, edge=high, press=long, transport=udp, url=udp://127.0.0.1:5000, body=takeoff
# action_mode    = channel=7, edge=low, transport=http, url=http://localhost:8080/mode/1
