# joystick2crsf configuration
#
# All values are defaults. Uncomment and edit to override.

# rate = 125
#   Update rate in Hz. Valid values: 25, 50, 125, 250, 333, 500.
rate=125

# stats = 0
#   Set to 1 to print loop timing statistics to stdout every second.
stats=0

# channels = 0
#   Set to 1 to print channel output values to stdout every frame.
channels=0

# protocol = crsf
#   Output protocol. Valid values: crsf, mavlink.
protocol=crsf

# udp_enabled = 1
#   Enable UDP output stream.
udp_enabled=1

# udp_target = 192.168.0.1:14550
#   Target address for UDP stream. Can be IP:port or [IPv6]:port.
udp_target=192.168.0.1:14550

# sse_enabled = 0
#   Enable Server-Sent Events (HTTP) output stream.
sse_enabled=0

# sse_bind = 127.0.0.1:8070
#   Address and port to bind for SSE server.
sse_bind=127.0.0.1:8070

# sse_path = /sse
#   HTTP path for SSE stream.
sse_path=/sse

# arm_toggle = 5
#   Channel index (1-based) to use as arming switch. The channel will latch
#   high/low based on momentary input from the joystick. Set to 0 to disable.
arm_toggle=5

# joystick_index = 0
#   SDL joystick index to use.
joystick_index=0

# rescan_interval = 5
#   Seconds to wait between attempts to find a joystick if disconnected.
rescan_interval=5

# startup_delay = 5
#   Seconds to wait at startup before first joystick scan (useful for systemd).
startup_delay=5

# use_gamecontroller = 1
#   Use SDL GameController API if available (provides standard mappings).
use_gamecontroller=1

# key_long_threshold_ms = 700
#   Time in milliseconds to consider a button press "long".
key_long_threshold_ms=700
verbose=1
# Example action bindings (channel-indexed, 1-16)
action_1=channel=7,edge=high,press=short,transport=udp,url=udp://127.0.0.1:5005,body={"zoom":"115,115,50,50"}
action_2=channel=7,edge=low,press=short,transport=udp,url=udp://127.0.0.1:5005,body={"zoom":"100,100,50,50"} 
action_3=channel=8,edge=high,press=short,transport=udp,url=udp://127.0.0.1:5005,body={"zoom":"80,80,50,50"}
action_4=channel=8,edge=low,press=short,transport=udp,url=udp://127.0.0.1:5005,body={"zoom":"125,125,50,50"} 
action_5=channel=9,edge=high,press=short,transport=http,url=http://192.168.2.20:55667/udp,method=POST,body={"host":"192.168.2.20","port":5005,"payload":"{\"zoom\":\"100,100,50,50\"}"}
action_6=channel=10,edge=high,press=short,transport=http,url=http://10.6.0.50:55667/exec,method=POST,body={"path":"/sys/video/set","args":["outgoing_enabled=true"]}
action_7=channel=10,edge=high,press=long,transport=http,url=http://10.6.0.50:55667/exec,method=POST,body={"path":"/sys/video/set","args":["outgoing_enabled=false"]}



# UDP output (enabled by default)
udp_enabled=false
udp_target=10.6.0.50:14550

# MAVLink v2 RC_CHANNELS_OVERRIDE settings (ignored unless protocol=mavlink)
mavlink_sysid=255            # source system id (255=GCS)
mavlink_compid=190           # source component id (190=telemetry)
mavlink_target_sysid=1       # target system id (1=flight controller)
mavlink_target_compid=1      # target component id (1=autopilot)

# SSE telemetry stream (disabled by default)
sse_enabled=false
sse_bind=0.0.0.0:8070     # listener host:port (use *:PORT for all interfaces)
sse_path=/sse               # HTTP path clients must request
