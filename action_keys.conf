# action_keys configuration
# Each action binds a key to a UDP/HTTP request.
http_timeout_ms=1500

# action_N accepts: key, button, transport (udp|http), url/destination, method (GET|POST),
# body/payload, header (repeatable), timeout_ms.
# key picks the first character only.
action_1=key=a,transport=udp,url=udp://10.0.0.2:9000,body={"ping":1}
action_2=key=b,transport=http,url=http://10.0.0.2/api,method=POST,body={"cmd":"start"}
