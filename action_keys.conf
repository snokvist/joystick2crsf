# action_keys configuration
# Each action binds a key to a UDP/HTTP request.
http_timeout_ms=1500
verbose=1
input_device=/dev/input/joystick2crsf-keys

# action_N accepts: key, button, transport (udp|http), url/destination, method (GET|POST),
# body/payload, header (repeatable), timeout_ms.
# key picks the first character only.
action_1=key=e,transport=udp,url=udp://127.0.0.1:5005,body={"text":["text333","text3"],"value":[1,2,3,4]}
action_2=key=e,transport=http,url=http://192.168.2.20:55667/udp,method=POST,body={"host":"192.168.2.20","port":5005,"payload":"{\"zoom\":\"25,25,20,40\",\"ttl_ms\":10000}"}
action_3=key=enter,transport=http,url=http://192.168.2.20:55667/udp,method=POST,body={"host":"192.168.2.20","port":5005,"payload":"{\"zoom\":\"100,100,50,50\",\"ttl_ms\":10000}"}
action_4=key=left,transport=udp,url=udp://127.0.0.1:5005,body={"text":["text444","text3"],"value":[4,4,4,4]}
action_5=key=right,transport=udp,url=udp://127.0.0.1:5005,body={"text":["text555","text3"],"value":[5,5,5,5]}
action_6=key=down,transport=udp,url=udp://127.0.0.1:5005,body={"zoom":"150,150,40,60","ttl_ms":1000}
